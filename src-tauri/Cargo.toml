# SPDX-License-Identifier: MIT

[package]
name = "spagitty"
description = "A cross-platform desktop Git client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
default-run = "spagitty"

[lib]
name = "spagitty_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# The build script reads `cargo metadata` and the installed frontend tree to
# generate the dependency license list. Already a runtime dependency; no new tool.
serde_json = { workspace = true }

[dependencies]
spagitty-core = { workspace = true }
spagitty-farm = { workspace = true }
spagitty-extensions = { workspace = true }
# The Terminal screen's PTY and multiplexer rules (FEAT-130).
spagitty-process = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# Pull request notifications in the operating system's notification centre
# (FEAT-114). Called from Rust only, so there is no frontend package.
# Held at 2.4: 2.5 needs tauri 2.12, and the CLI refuses a build whose
# Rust crates and `@tauri-apps/api` differ in minor version.
tauri-plugin-notification = "~2.4"
# Installs a newer Workbench from this repository's GitHub releases, verified
# against Workbench's own key (FEAT-187). Called from Rust only, like the
# notification plugin, so the webview gets no updater permission. It keeps the
# system proxy, which a bank's network routes through, and leaves out `zip`:
# that feature only unpacks v1 `.nsis.zip` and `.AppImage.tar.gz` updates,
# Workbench publishes the bare setup and AppImage, and the zip 4 it pulls in
# has open advisories (RUSTSEC-2026-0367 to 0369).
# Held at 2.12: 2.13 needs tauri 2.12, for the reason given above.
tauri-plugin-updater = { version = "~2.12", default-features = false, features = ["rustls-tls", "system-proxy"] }
serde = { workspace = true }
serde_json = { workspace = true }
notify = "8"

[dev-dependencies]
# `tauri::test::mock_app` supplies an `AppHandle<MockRuntime>`, which is the
# whole reason this crate is generic over `Runtime` (TASK-003).
tauri = { version = "2", features = ["test"] }
# Real repositories to walk, rather than a second fixture builder here.
spagitty-core = { workspace = true, features = ["fixture"] }
spagitty-farm = { workspace = true, features = ["fixture"] }
# The isolated configuration directory the tests point HOME at.
tempfile = "3"
