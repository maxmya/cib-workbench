# SPDX-License-Identifier: MIT
#
# Gate 0, on its own (Workbench). It used to open checks.yml, and gates 5 and 6
# could not start until every check had finished, because a job can only wait
# on a whole called workflow. Here, the build waits only for this answer and
# runs beside gates 1 to 4; the release still waits for all of them.

name: scope

on:
  workflow_call:
    outputs:
      ship:
        description: Whether the change ships in the application; gates 5 and 6 read it.
        value: ${{ jobs.scope.outputs.ship }}

jobs:
  # --- Scope --------------------------------------------------------------
  # Decide whether this change is something people download. Gates 5 and 6
  # read the answer; gates 1 to 4 always run so a docs edit that breaks the
  # brand check or the licence files still fails.
  scope:
    name: 0 · scope
    runs-on: ubuntu-latest
    outputs:
      ship: ${{ steps.classify.outputs.ship }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify whether this change ships
        id: classify
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            range="origin/${{ github.base_ref }}...HEAD"
          else
            before="${{ github.event.before }}"
            # A brand-new branch has no previous tip; treat it as shipping so
            # the first push cannot slip past a release by accident.
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              echo "ship=true" >> "$GITHUB_OUTPUT"
              echo "no previous tip — treating as a shipping change"
              exit 0
            fi
            range="$before...${{ github.sha }}"
          fi

          mapfile -t files < <(git diff --name-only "$range")
          if [ "${#files[@]}" -eq 0 ]; then
            echo "ship=false" >> "$GITHUB_OUTPUT"
            echo "no files changed"
            exit 0
          fi

          printf 'changed:\n'
          printf '  %s\n' "${files[@]}"

          ship=false
          for f in "${files[@]}"; do
            case "$f" in
              src/*|src-tauri/*|crates/*|extensions/*|packages/extension-sdk/*|tools/extensions/*|schemas/extensions/*) ship=true ;;
              # Workbench: the app bundles these (the icon, the fonts, CIB's images).
              assets/brand/*|assets/fonts/*) ship=true ;;
              package.json|Cargo.toml|Cargo.lock|bun.lock|bun.lockb) ship=true ;;
              vite.config.ts|vite.config.js|svelte.config.js|svelte.config.ts|tsconfig.json) ship=true ;;
              */Cargo.toml) ship=true ;;
            esac
          done

          # A version whose tag already exists has been released. Gate 6
          # refuses to move that tag, so running gates 5 and 6
          # here only builds four platforms and then fails. Code merged
          # without a version bump goes out with the next release, the same
          # way documentation does. Gate 6 still refuses the tag in case this
          # check is ever bypassed.
          if [ "$ship" = true ] && [ "${{ github.event_name }}" = "push" ]; then
            version=$(node -p "require('./package.json').version")
            if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
              echo "v$version is already released — gates 5 and 6 stay off until the version is bumped"
              ship=false
            fi
          fi

          echo "ship=$ship" >> "$GITHUB_OUTPUT"
          if [ "$ship" = true ]; then
            echo "shipping change — gates 5 and 6 will run on main"
          else
            echo "documentation / record / collateral only — gates 5 and 6 stay off"
          fi
