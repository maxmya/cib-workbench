# SPDX-License-Identifier: MIT
#
# Gates 1 to 4, called by both lanes: gates.yml on a push to `main` or `dev`,
# and pull-request.yml on a pull request into either. Kept in one file so the
# two lanes cannot check different things.
#
# Workbench: the four gates run side by side rather than one after another, so
# a run takes as long as its slowest job, not the sum of them (the author,
# 2026-10-26). A failure still fails the run and still stops a release, which
# needs every one of them; what is lost is only stopping the others early.
# Gate 0 is scope.yml, which only the push lane needs.
#
# Gates 5 and 6 are not here. They only ever run on a push to `main`, and a
# job that is skipped still shows in a pull request's checks — two grey
# "skipped" rows on every merge box, which read as checks that had not passed.
# A pull request now runs only what a pull request can pass.
#
# What each gate proves, and why it sits where it does, is in docs/ci.md.

name: checks

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  # Abandon a stalled cache segment so Cargo can compile dependencies instead.
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2
  # The coverage floor, in one place so no gate can disagree with another.
  COVERAGE_FLOOR: 70

jobs:
  # --- Gate 1 -------------------------------------------------------------
  # Cheapest and most certain first, so an obvious failure never burns a build.
  license:
    name: 1 · licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The runner image's Node is whatever the image shipped. The scripts in
      # this workflow run on 22.23.4, past HTTP2Shell (CVE-2026-111497).
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4

      # AGENTS.md forbids agent, tool and session attribution. The pull
      # request's own commits and its description are read; history before it
      # is left as it is. The description goes in through the environment, never
      # into the script text.
      - name: No agent attribution in the commits or the description
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          node tools/attribution.mjs commits "$BASE..$HEAD"
          printf '%s' "$PR_BODY" | node tools/attribution.mjs text -

      - name: The project's own license and attribution files are present
        run: |
          test -f LICENSE
          test -f NOTICE
          grep -q '"license": "MIT"' package.json
          grep -q 'license = "MIT"' Cargo.toml

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 5
        continue-on-error: true
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Rust dependency licenses
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile

      - name: JS dependency licenses
        run: |
          bunx license-checker-rseidelsohn@4 \
            --production \
            --onlyAllow "MIT;ISC;BSD-2-Clause;BSD-3-Clause;Apache-2.0;0BSD;CC0-1.0;Unlicense;BlueOak-1.0.0;Python-2.0" \
            --excludePrivatePackages

  # --- Gate 2 -------------------------------------------------------------
  quality:
    name: 2 · code quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 5
        continue-on-error: true
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/linux-deps

      - run: cargo fmt --all --check

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile

      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Clippy reads the workspace's rust-version, and cargo never checks it
      # against the dependencies' (TASK-072).
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
      - name: No dependency needs a newer Rust than Cargo.toml says
        run: node tools/rust-version.mjs
      - run: bun run check

      # The app icon and the brand collateral are generated by Pillow
      # scripts. If the committed bytes drift from what the scripts produce,
      # the identity has been hand-edited or the generator broken — a drift
      # error, not a warning, because a mangled icon ships in every build from
      # here on. docs/branding.md has the full tree.
      #
      # Workbench: its app icon is CIB's globe on CIB blue, drawn by
      # make-workbench-icon.py, so Spagitty's make-icons.py check is not run;
      # make-brand.py still owns Spagitty's own collateral, which is unchanged.
      - name: Brand and icon assets are current
        run: |
          python3 -m pip install --quiet pillow
          python3 tools/make-workbench-icon.py --check
          python3 tools/make-installer-art.py --check
          python3 tools/make-brand.py --check

      # Workbench is MIT. An upstream merge brings GPL headers with it.
      - name: Every first-party file is MIT
        run: node tools/brand-spdx.mjs --check

  # --- Gate 3 -------------------------------------------------------------
  tests:
    name: 3 · tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 5
        continue-on-error: true
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: ./.github/actions/linux-deps

      # The About screen's dependency list (src-tauri/licenses.rs) reads the
      # installed frontend tree, so the JS install comes before the Rust
      # coverage run.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile

      - name: Rust tests and coverage
        run: |
          cargo llvm-cov --workspace \
            --ignore-filename-regex '(fixture|testing)\.rs' \
            --fail-under-lines "$COVERAGE_FLOOR" \
            --summary-only

      # The thresholds live in vite.config.ts, so the same floor applies
      # locally and here.
      - name: Frontend tests and coverage
        run: bun run coverage

  farm_processes:
    name: 3 · farm processes (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 5
        continue-on-error: true
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/linux-deps
        if: matrix.os == 'ubuntu-latest'
      # The process tree moved to its own crate (FEAT-096), and the extension
      # host starts real worker processes inside it, so both run on every OS.
      - name: Descendant containment and noisy/cancellable verification
        run: |
          cargo test -p spagitty-process
          cargo test -p spagitty-farm --lib verification::command::tests
      - name: Extension workers, tools and packages on this OS
        run: |
          cargo test -p spagitty-extensions
          cargo test -p spagitty-farm --test supplemental

  # --- Gate 4 -------------------------------------------------------------
  security:
    name: 4 · security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 5
        continue-on-error: true
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Rust advisories
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: JS advisories
        run: bun audit --audit-level=high

      # gitleaks itself, not gitleaks-action.
      #
      # The action refuses to run for an organization account without a paid
      # licence — "[GitLumiere] is an organization. License key is required." —
      # so this gate failed on the tool never starting rather than on anything it
      # found, and no diff has ever actually been scanned. The binary is the same
      # scanner with the same rules and needs no licence.
      #
      # `--no-git` would scan the working tree; `detect` walks history, which is
      # what catches a secret committed and then removed in a later commit.
      - name: Secrets in the diff
        run: |
          version=8.28.0
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --redact --verbose --exit-code 1
