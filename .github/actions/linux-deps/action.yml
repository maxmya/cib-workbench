# SPDX-License-Identifier: MIT
#
# Linux system dependencies. Needed by every job that compiles, which includes
# the test and lint gates and not just the build.
#
# Two groups:
#
#   webkit2gtk and friends  Tauri 2 links against them to compile at all.
#   libdbus-1-dev           the OS keychain, reached through the secret service
#                           over D-Bus (FEAT-017). `spagitty-core` links it, so
#                           a job that only runs `cargo test` needs it too.

name: Linux build dependencies
description: Install the webkit2gtk, libsoup and dbus packages Spagitty needs on Linux

runs:
  using: composite
  steps:
    # Workbench: the packages are kept between runs. A runner's Ubuntu mirror
    # now and then serves them at ~40 kB/s, which made one job in every run
    # spend 21-25 minutes on this step; with the .deb files restored, apt has
    # nothing to download. Keyed on this file, so a new package refreshes it.
    - name: Restore the downloaded packages
      if: runner.os == 'Linux'
      uses: actions/cache@v4
      with:
        path: ~/.apt-archives
        key: apt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/actions/linux-deps/action.yml') }}
        restore-keys: apt-${{ runner.os }}-${{ runner.arch }}-

    - name: Install
      if: runner.os == 'Linux'
      shell: bash
      run: |
        mkdir -p ~/.apt-archives/partial
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          -o Dir::Cache::Archives="$HOME/.apt-archives" \
          libwebkit2gtk-4.1-dev \
          libsoup-3.0-dev \
          libjavascriptcoregtk-4.1-dev \
          libappindicator3-dev \
          librsvg2-dev \
          patchelf \
          build-essential \
          curl \
          wget \
          file \
          libssl-dev \
          libgtk-3-dev \
          libdbus-1-dev \
          pkg-config
        # Readable by the cache step that saves it after the job.
        sudo chown -R "$USER" ~/.apt-archives
