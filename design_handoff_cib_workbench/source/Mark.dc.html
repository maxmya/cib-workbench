<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workbench — the mark</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1200px; height: 680px; box-sizing: border-box; display: grid; grid-template-columns: 1.5fr 1fr; font-family: 'Sora', 'Segoe UI', sans-serif; color: #E7EDF6; background: #06101F">

  <section style="display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 18px; padding: 40px; background-color: #06101F; background-image: radial-gradient(560px 360px at 50% 50%, rgba(0,91,171,0.36), rgba(6,16,31,0) 72%)">
    <span style="font-size: 15px; font-weight: 600; letter-spacing: 0.32em; color: rgba(231,237,246,0.62)">CIB</span>
    <div role="img" aria-label="Workbench" style="display: inline-flex; align-items: baseline; font-size: 96px; line-height: 1; font-weight: 600; letter-spacing: -0.035em; color: #FFFFFF"><span aria-hidden="true">W</span><img src="/_blob/ed33cc49aaa2e6d4859e85624b009cae" alt="" style="display: inline-block; height: 70px; width: auto; margin: 0 4px"><span aria-hidden="true">rkbench</span></div>
  </section>

  <div style="display: grid; grid-template-rows: 1.3fr 1fr">
    <section aria-label="App icon" style="display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 22px; padding: 32px; background: #0B1A30">
      <div role="img" aria-label="Workbench app icon" style="width: 168px; height: 168px; border-radius: 39px; background: #005BAB; display: grid; place-items: center">
        <img src="/_blob/ed33cc49aaa2e6d4859e85624b009cae" alt="" style="display: block; height: 96px; width: auto">
      </div>
      <div style="display: flex; align-items: flex-end; gap: 18px">
        <div role="img" aria-label="Workbench app icon, 48 pixels" style="width: 48px; height: 48px; border-radius: 11px; background: #005BAB; display: grid; place-items: center"><img src="/_blob/ed33cc49aaa2e6d4859e85624b009cae" alt="" style="display: block; height: 28px; width: auto"></div>
        <div role="img" aria-label="Workbench app icon, 32 pixels" style="width: 32px; height: 32px; border-radius: 7px; background: #005BAB; display: grid; place-items: center"><img src="/_blob/ed33cc49aaa2e6d4859e85624b009cae" alt="" style="display: block; height: 20px; width: auto"></div>
        <div role="img" aria-label="Workbench app icon, 16 pixels" style="width: 16px; height: 16px; border-radius: 4px; background: #005BAB; display: grid; place-items: center"><img src="/_blob/ed33cc49aaa2e6d4859e85624b009cae" alt="" style="display: block; height: 11px; width: auto"></div>
      </div>
    </section>

    <section aria-label="On light" style="display: flex; justify-content: center; align-items: center; padding: 32px; background: #FFFFFF">
      <div role="img" aria-label="Workbench on light" style="display: inline-flex; align-items: baseline; font-size: 52px; line-height: 1; font-weight: 600; letter-spacing: -0.035em; color: #0B1A30"><span aria-hidden="true">W</span><img src="/_blob/ed33cc49aaa2e6d4859e85624b009cae" alt="" style="display: inline-block; height: 38px; width: auto; margin: 0 2px"><span aria-hidden="true">rkbench</span></div>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":680}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
