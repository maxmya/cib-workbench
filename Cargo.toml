# SPDX-License-Identifier: MIT

[workspace]
resolver = "2"
members = [
    "crates/spagitty-core",
    "crates/spagitty-farm",
    "crates/spagitty-process",
    "crates/spagitty-extensions",
    "src-tauri",
]

[workspace.package]
version = "2.0.3"
edition = "2021"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/Spa-git-ty/spagitty"
authors = ["Spagitty contributors"]

[workspace.dependencies]
spagitty-core = { path = "crates/spagitty-core" }
spagitty-farm = { path = "crates/spagitty-farm" }
spagitty-process = { path = "crates/spagitty-process" }
spagitty-extensions = { path = "crates/spagitty-extensions" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
